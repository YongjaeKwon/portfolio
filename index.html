<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

    <!-- Korean body, display, and mono fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("portfolio-theme");
          const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
          const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const savedSkin = localStorage.getItem("portfolio-skin");
          document.documentElement.dataset.skin =
            savedSkin === "maple" || savedSkin === "overwatch" ? savedSkin : "default";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.skin = "default";
        }
      })();
    </script>
    <meta
      name="description"
      content="권용재 웹 개발자 포트폴리오. 협력사 포탈 PPS와 교육청·공공사업 장비 통합 시스템 TSMS에서 개발하고 운영한 기능을 정리했습니다."
    />
